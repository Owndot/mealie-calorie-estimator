name: Build BLS ingredient database

on:
  push:
    branches:
      - bls-db-build
    paths:
      - scripts/build_bls_ingredients_db.py
      - .github/workflows/build-bls-db.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder dependencies
        run: pip install --disable-pip-version-check openpyxl requests
      - name: Adapt parser to current BLS workbook layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_bls_ingredients_db.py')
          s = p.read_text()
          old = '''    if (len(header) - 3) % 3 != 0:\n        raise RuntimeError(f"Unexpected BLS column count: {len(header)}")\n\n    nutrient_columns: list[tuple[int, str, str, str | None, str]] = []\n    for col in range(3, len(header), 3):\n'''
          new = '''    # BLS 4.0 currently has one trailing non-nutrient column after the\n    # 138 value/origin/reference triplets. Parse exactly those 138 triplets\n    # and ignore any later non-nutrient metadata columns.\n    required_columns = 3 + EXPECTED_NUTRIENTS * 3\n    if len(header) < required_columns:\n        raise RuntimeError(f"BLS workbook too short: {len(header)} columns")\n\n    nutrient_columns: list[tuple[int, str, str, str | None, str]] = []\n    for col in range(3, required_columns, 3):\n'''
          if old not in s:
              raise SystemExit('expected parser block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Build lossless SQLite subset
        run: python scripts/build_bls_ingredients_db.py
      - name: Show validation report
        run: cat BLS_4_0_ingredients_2992.validation.json
      - name: Query smoke tests
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect('BLS_4_0_ingredients_2992.sqlite')
          assert db.execute('select count(*) from foods').fetchone()[0] == 2992
          assert db.execute('select count(*) from nutrients').fetchone()[0] == 138
          assert db.execute('select count(*) from food_nutrients').fetchone()[0] == 2992 * 138
          for code in ('F503100', 'M402600'):
              print(code, db.execute('select name_de from foods where bls_code=?', (code,)).fetchone())
          print('special tokens:', db.execute("select value_raw,count(*) from food_nutrients where value_raw in ('TR','<LOD','<LOQ','<LOD or <LOQ','-') group by value_raw").fetchall())
          print('integrity:', db.execute('pragma integrity_check').fetchone()[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BLS_4_0_ingredients_2992
          path: |
            BLS_4_0_ingredients_2992.sqlite
            BLS_4_0_ingredients_2992.validation.json
          if-no-files-found: error
          retention-days: 7
