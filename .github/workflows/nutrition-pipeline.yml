name: Nutrition pipeline
on:
  push:
    branches: [main, 'feat/whole-recipe-nutrition-pipeline']
  pull_request:
permissions:
  contents: read
jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: docker build --target test -t mealie-calorie-estimator:test .
      - run: docker build -t mealie-calorie-estimator:local .
      - run: node tests/docker-smoke.mjs mealie-calorie-estimator:local
