version: "3.9"

x-nutrition-env: &nutrition-env
  MEALIE_URL: ${MEALIE_URL:-http://mealie:9000}
  OFF_LANGUAGE: ${OFF_LANGUAGE:-en}
  # Passed through empty on purpose: the service then builds its own User-Agent from the package
  # version, so it cannot drift. A default stated here would have pinned "1.0.0" forever, since
  # compose always supplies the variable and the built-in default would never be reached.
  OFF_USER_AGENT: ${OFF_USER_AGENT:-}
  LLM_ENABLED: ${LLM_ENABLED:-false}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-/chat/completions}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  LLM_RATE_LIMIT: ${LLM_RATE_LIMIT:-30}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  nutrition-engine:
    image: ghcr.io/owndot/mealie-nutrition-engine:latest
    # Use `build: .` instead of `image:` to run from a local checkout.
    container_name: mealie-nutrition-engine
    environment:
      <<: *nutrition-env
      MEALIE_API_TOKEN: ${MEALIE_API_TOKEN}
      # Optional: the semantic judge, off unless explicitly enabled.
      LLM_JUDGE_ENABLED: ${LLM_JUDGE_ENABLED:-false}
      # Optional: the user-confirmed override API. Unset means the routes do not exist.
      OVERRIDE_ADMIN_TOKEN: ${OVERRIDE_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Durable state. `cache.db` is a rebuildable cache; `overrides.db` holds the food records a
      # person deliberately chose and is NOT reconstructible — back this volume up.
      - nutrition-engine-data:/app/data
    restart: unless-stopped

  nutrition-engine-test:
    build: .
    container_name: mealie-nutrition-engine-test
    env_file: .compose-test.env
    environment:
      <<: *nutrition-env
      MEALIE_URL: http://mealie:9000
      LOG_LEVEL: debug
    ports:
      - "8002:8000"
    depends_on:
      mealie:
        condition: service_healthy
      mock-off:
        condition: service_started
    profiles:
      - test

  mock-off:
    image: node:22-alpine
    container_name: mealie-mock-off
    command: ["node", "/app/mock-off-server.js"]
    volumes:
      - ./tests/mock-off-server.js:/app/mock-off-server.js
    ports:
      - "3001:3000"
    profiles:
      - test

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.19.2
    container_name: mealie-test
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - mealie-test-data:/app/data/
    environment:
      ALLOW_SIGNUP: "true"
      DB_ENGINE: sqlite
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/api/app/about"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    profiles:
      - test

volumes:
  nutrition-engine-data:
  mealie-test-data:
